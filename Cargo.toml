[package]
name = "epub2cbz"
version = "0.1.0"
edition = "2021"
description = "Extract .epub Manga and Comic ebooks into .cbz files"
license = "MIT"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:indicatif"]
gui = ["dep:dioxus-native", "dep:rfd"]

[[bin]]
name = "epub2cbz"
path = "src/main.rs"

[dependencies]
zip = "2.2"
roxmltree = "0.20"
quick-xml = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
rayon = "1.10"
walkdir = "2.5"
anyhow = "1.0"
regex = "1.11"
url = "2.5"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

clap = { version = "4.5", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }

dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "fe33b77", default-features = false, features = ["prelude", "system-fonts", "vello-hybrid", "file-dialog", "woff"], optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
lto = true
strip = true
opt-level = 3
